name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt ruff
      - run: ruff check ..
      - name: Download embedding model
        run: python scripts/fetch_embedder.py
      - name: Unit and API tests
        run: python -m pytest -q
      - name: Safety eval (rules pipeline, gated)
        run: python ../evals/run_eval.py --pipeline rules --gate --out /tmp/rules-eval.json
      - name: Agent eval (only when an API key secret is configured)
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        if: ${{ env.GROQ_API_KEY != '' }}
        run: python ../evals/run_eval.py --pipeline agent --gate --delay 2 --out /tmp/agent-eval.json
      - name: Eval summary
        if: always()
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, os
          path = "/tmp/rules-eval.json"
          if os.path.exists(path):
              m = json.load(open(path)).get("metrics", {})
              print("### Safety eval (rules pipeline)")
              for key in ("accuracy", "emergency_recall", "under_triage_rate", "over_triage_rate", "critical_misses"):
                  if key in m:
                      print(f"- {key}: {m[key]}")
          PY

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
