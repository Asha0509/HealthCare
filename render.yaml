# Render blueprint. Deploys only after the GitHub checks on the branch pass.
services:
  - type: web
    name: healthai-triage-api
    runtime: python
    plan: starter
    branch: main
    autoDeployTrigger: checksPass
    buildCommand: pip install -r backend/requirements.txt && python backend/scripts/fetch_embedder.py
    startCommand: cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/docs
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SECRET_KEY
        generateValue: true
      - key: GROQ_API_KEY
        sync: false
      - key: NVIDIA_NIM_API_KEY
        sync: false
      - key: DECISION_MODEL
        value: "off"
  - type: web
    name: healthai-triage
    runtime: static
    branch: main
    autoDeployTrigger: checksPass
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
